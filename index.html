<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>知識刊 — AI 情報 & 深度摘要</title>
  <meta name="description" content="每日 AI 情報精選與深度主題摘要，知識刊為你整理最重要的訊息。">

  <!-- Triple font stack: display / editorial serif / mono labels -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Libre+Bodoni:ital,wght@0,400;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,700;1,900&display=swap" rel="stylesheet">

  <style>
    /* ── Design Tokens ───────────────────────────────────────── */
    :root {
      /* News side — cinematic dark */
      --n-bg:      #030304;
      --n-surface: #0b0b0d;
      --n-text:    #ededef;
      --n-muted:   rgba(237,237,239,.32);
      --n-gold:    #c8a84b;
      --n-gold-t:  rgba(200,168,75,.10);
      --n-border:  rgba(200,168,75,.07);

      /* Summary side — warm editorial */
      --s-bg:      #f4efe6;
      --s-surface: #fffdf8;
      --s-text:    #18181b;
      --s-green:   #2d4a3e;
      --s-sage:    #52756a;

      /* Typography */
      --fd: 'Playfair Display', Georgia, 'Times New Roman', serif;
      --fs: 'Libre Bodoni', Georgia, serif;
      --fm: 'JetBrains Mono', 'Courier New', monospace;

      /* Motion — Expo Out (iOS/Framer premium feel) */
      --ease: cubic-bezier(.16,1,.3,1);
    }

    /* ── Reset ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      background: var(--n-bg);
      color: var(--n-text);
      font-family: var(--fs);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    img { display: block; max-width: 100%; }
    button { cursor: pointer; font-family: inherit; }

    /* ── Reduced Motion ──────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

    /* ════════════════════════════════════════════════════════════
       MASTHEAD
       ════════════════════════════════════════════════════════════ */
    .masthead {
      position: relative;
      text-align: center;
      padding: 2.75rem 2rem 2.25rem;
      overflow: hidden;
      animation: fade-down 1s var(--ease) both;
    }

    /* Corner vignette glow */
    .masthead::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 80% at 0% 0%, rgba(200,168,75,.05), transparent),
        radial-gradient(ellipse 60% 80% at 100% 0%, rgba(200,168,75,.05), transparent);
      pointer-events: none;
    }

    .masthead-eyebrow {
      font-family: var(--fm);
      font-size: .6rem;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: rgba(237,237,239,.25);
      margin-bottom: 1.2rem;
    }
    .masthead-eyebrow b { color: var(--n-gold); font-weight: 500; }

    /* Animated rule */
    .rule {
      max-width: 840px;
      margin: 0 auto;
      height: 1px;
      background: linear-gradient(90deg,
        transparent 0%, var(--n-gold) 28%, var(--n-gold) 72%, transparent 100%);
      transform-origin: center;
    }
    .rule-top {
      margin-bottom: 1.15rem;
      animation: rule-expand .9s .2s var(--ease) both;
    }
    .rule-bot {
      margin-top: 1.15rem;
      animation: rule-expand .9s .25s var(--ease) both;
    }

    .pub-title {
      font-family: var(--fd);
      font-size: clamp(4.2rem, 13vw, 10.5rem);
      font-weight: 900;
      font-style: italic;
      letter-spacing: .04em;
      line-height: .93;
      color: var(--n-text);
      animation: title-bloom 1.1s .08s var(--ease) both;
    }
    .pub-title em {
      font-style: normal;
      color: var(--n-gold);
      position: relative;
    }
    /* Thin underline on 識 */
    .pub-title em::after {
      content: '';
      position: absolute;
      bottom: .08em;
      left: 0; right: 0;
      height: .07em;
      background: var(--n-gold);
      opacity: .45;
    }

    .masthead-sub {
      margin-top: .6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      font-family: var(--fm);
      font-size: .58rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: rgba(237,237,239,.25);
    }
    .masthead-sub .pip {
      display: inline-block;
      width: 3px; height: 3px;
      border-radius: 50%;
      background: var(--n-gold);
      opacity: .55;
    }
    #mastheadDate { color: rgba(237,237,239,.45); }

    /* ════════════════════════════════════════════════════════════
       HERO SPLIT
       ════════════════════════════════════════════════════════════ */
    .hero-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 87vh;
      border-top: 1px solid var(--n-border);
      border-bottom: 1px solid var(--n-border);
    }
    @media (max-width: 680px) {
      .hero-split { grid-template-columns: 1fr; min-height: auto; }

      /* News panel: give it a natural height from content + cap the padding */
      .hero-news {
        padding: 2.5rem 1.75rem 3rem;
        min-height: 72vw;
      }
      /* Background date glyphs: too big on narrow screens */
      .bgdate-m, .bgdate-d { font-size: clamp(5rem, 22vw, 8rem); }
      .bgdate-y { font-size: clamp(1.2rem, 4.5vw, 2rem); }

      /* Summary panel collapses because all children are position:absolute —
         give it an explicit min-height so it is visible when stacked */
      .hero-summary { min-height: 78vw; }
      .hero-sum-content { padding: 2.5rem 1.75rem 3rem; }

      /* Masthead title: clamp min is 4.2rem which is fine on mobile */
      .masthead { padding: 2rem 1.5rem 1.75rem; }

      /* Archive paddings */
      .archive-header { padding: 3rem 1.25rem 0; }
      .archive { padding: 1.75rem 1.25rem 5rem; }
    }

    /* ── Hero: News (left) ───────────────────────────────────── */
    .hero-news {
      position: relative;
      padding: 3.5rem 3.25rem 4.25rem;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background: var(--n-bg);
      border-right: 1px solid var(--n-border);
      cursor: pointer;
      overflow: hidden;
      animation: slide-left .9s .12s var(--ease) both;
      transition: background .3s var(--ease);
    }
    .hero-news:hover { background: #050508; }

    /* Diagonal cross-hatch texture */
    .hero-news::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        repeating-linear-gradient(
          45deg, transparent, transparent 28px,
          rgba(200,168,75,.014) 28px, rgba(200,168,75,.014) 29px
        ),
        repeating-linear-gradient(
          -45deg, transparent, transparent 28px,
          rgba(200,168,75,.014) 28px, rgba(200,168,75,.014) 29px
        );
      pointer-events: none;
    }

    /* Animated ambient gold blob */
    .news-blob {
      position: absolute;
      width: 60%;
      aspect-ratio: 1;
      top: 10%; left: -15%;
      background: radial-gradient(circle, rgba(200,168,75,.085) 0%, transparent 68%);
      border-radius: 50%;
      animation: blob 11s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes blob {
      0%   { transform: translate(0,0) scale(1); }
      100% { transform: translate(55px,-35px) scale(1.15); }
    }

    /* Giant background date */
    .bgdate {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: var(--fd);
      font-weight: 900;
      line-height: .80;
      color: rgba(200,168,75,.038);
      pointer-events: none;
      user-select: none;
    }
    .bgdate-m, .bgdate-d { font-size: clamp(8rem, 17vw, 16rem); }
    .bgdate-y {
      font-size: clamp(1.8rem, 4vw, 3.8rem);
      letter-spacing: .2em;
      margin-top: .6rem;
      opacity: .7;
    }

    /* ── Shared hero label system ────────────────────────────── */
    .h-tag {
      font-family: var(--fm);
      font-size: .58rem;
      letter-spacing: .32em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: .9rem;
      margin-bottom: 1.45rem;
    }
    .h-tag::before {
      content: '';
      width: 2.4rem; height: 1px;
      background: currentColor;
      flex-shrink: 0;
    }
    .hero-news .h-tag   { color: var(--n-gold); }
    .hero-sum-content .h-tag { color: rgba(244,239,230,.52); }

    .h-date {
      font-family: var(--fm);
      font-size: .7rem;
      letter-spacing: .14em;
      margin-bottom: .75rem;
    }
    .hero-news .h-date   { color: var(--n-muted); }
    .hero-sum-content .h-date { color: rgba(244,239,230,.36); }

    .h-title {
      font-family: var(--fd);
      font-weight: 700;
      font-size: clamp(1.55rem, 2.7vw, 2.55rem);
      line-height: 1.22;
      margin-bottom: 2.4rem;
    }
    .hero-news .h-title {
      color: var(--n-text);
      transition: color .28s var(--ease);
    }
    .hero-news:hover .h-title { color: var(--n-gold); }
    .hero-sum-content .h-title { color: #f0ead8; }

    .h-sub {
      display: block;
      font-size: .76em;
      font-weight: 400;
      font-style: italic;
      opacity: .5;
      margin-top: .35rem;
    }

    .h-cta {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      font-family: var(--fm);
      font-size: .58rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      border: 1px solid currentColor;
      padding: .65rem 1.45rem;
      transition: background .22s var(--ease), color .22s var(--ease);
      align-self: flex-start;
      user-select: none;
    }
    .hero-news .h-cta   { color: var(--n-gold); }
    .hero-news:hover .h-cta { background: var(--n-gold); color: var(--n-bg); }
    .hero-summary .h-cta { color: rgba(244,239,230,.62); }
    .hero-summary:hover .h-cta {
      background: var(--s-surface);
      color: var(--s-green);
      border-color: var(--s-surface);
    }

    /* Inner content wrapper — sits above blobs */
    .hero-news-inner { position: relative; z-index: 1; }

    /* ── Hero: Summary (right) ───────────────────────────────── */
    .hero-summary {
      position: relative;
      overflow: hidden;
      cursor: pointer;
      background: var(--s-green);
      animation: slide-right .9s .12s var(--ease) both;
    }

    .sum-img {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      filter: brightness(.76) saturate(.82);
      transition: transform .7s var(--ease), filter .5s var(--ease);
    }
    .hero-summary:hover .sum-img {
      transform: scale(1.055);
      filter: brightness(.7) saturate(.88);
    }

    .sum-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(15,30,23,.98) 0%,
        rgba(15,30,23,.58) 38%,
        rgba(15,30,23,.12) 68%,
        transparent 100%
      );
    }

    /* Fallback gradient when no image */
    .sum-fallback {
      position: absolute;
      inset: 0;
      background: linear-gradient(148deg, #2d4a3e 0%, #162a22 52%, #3d6b5a 100%);
    }
    .sum-fallback::after {
      content: attr(data-char);
      position: absolute;
      bottom: -.08em; right: -.04em;
      font-family: var(--fd);
      font-size: clamp(12rem, 28vw, 22rem);
      font-weight: 900;
      line-height: 1;
      color: rgba(244,239,230,.046);
      user-select: none;
      pointer-events: none;
    }

    .hero-sum-content {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 3.5rem 3.25rem 4.25rem;
      z-index: 1;
    }

    /* ════════════════════════════════════════════════════════════
       ARCHIVE
       ════════════════════════════════════════════════════════════ */
    .archive-header {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 3.75rem 2rem 0;
      max-width: 1320px;
      margin: 0 auto;
    }
    .archive-label {
      font-family: var(--fm);
      font-size: .56rem;
      letter-spacing: .34em;
      text-transform: uppercase;
      color: rgba(237,237,239,.22);
      white-space: nowrap;
    }
    .archive-rule {
      flex: 1; height: 1px;
      background: var(--n-border);
    }

    .archive { padding: 2rem 2rem 6rem; }

    .archive-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1px;
      max-width: 1320px;
      margin: 0 auto;
      background: var(--n-border);
    }

    /* ── Card ────────────────────────────────────────────────── */
    .card {
      padding: 2rem 2.25rem 2.6rem;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition:
        background .25s var(--ease),
        transform .18s var(--ease);
      /* Initial state for stagger-in animation */
      opacity: 0;
      transform: translateY(16px);
    }
    .card.visible {
      animation: card-in .52s var(--ease) both;
    }
    .card:active { transform: scale(0.975); }

    .card--news {
      background: var(--n-surface);
      border-left: 2px solid rgba(200,168,75,.12);
    }
    .card--summary { background: var(--s-bg); }

    .card--news:hover {
      background: #101014;
      border-left-color: rgba(200,168,75,.28);
    }
    .card--summary:hover { background: #ede8df; }

    /* Thumbnail for summary cards */
    .card-thumb {
      width: calc(100% + 4.5rem);
      height: 128px;
      object-fit: cover;
      margin: -2rem -2.25rem 1.5rem;
      filter: brightness(.86) saturate(.8);
      transition: filter .28s var(--ease);
    }
    .card--summary:hover .card-thumb { filter: brightness(.94) saturate(.95); }

    .card-tag {
      font-family: var(--fm);
      font-size: .54rem;
      letter-spacing: .3em;
      text-transform: uppercase;
      margin-bottom: .7rem;
    }
    .card--news    .card-tag { color: var(--n-gold); }
    .card--summary .card-tag { color: var(--s-sage); }

    .card-date {
      font-family: var(--fm);
      font-size: .65rem;
      letter-spacing: .12em;
      margin-bottom: .5rem;
    }
    .card--news    .card-date { color: rgba(237,237,239,.26); }
    .card--summary .card-date { color: var(--s-sage); }

    .card-title {
      font-family: var(--fs);
      font-weight: 700;
      font-size: 1.02rem;
      line-height: 1.48;
    }
    .card--news    .card-title { color: var(--n-text); }
    .card--summary .card-title { color: var(--s-text); }

    .card-sub {
      display: block;
      font-size: .78em;
      font-weight: 400;
      font-style: italic;
      opacity: .48;
      margin-top: .22rem;
    }

    /* Arrow appears on hover */
    .card-arrow {
      position: absolute;
      bottom: 1.35rem; right: 1.5rem;
      font-family: var(--fm);
      font-size: .8rem;
      opacity: 0;
      transform: translate(-7px, 5px);
      transition: opacity .2s var(--ease), transform .2s var(--ease);
    }
    .card--news    .card-arrow { color: var(--n-gold); }
    .card--summary .card-arrow { color: var(--s-green); }
    .card:hover .card-arrow { opacity: 1; transform: translate(0,0); }

    /* ════════════════════════════════════════════════════════════
       READER OVERLAY
       ════════════════════════════════════════════════════════════ */
    .reader {
      position: fixed;
      inset: 0;
      z-index: 900;
      display: flex;
      flex-direction: column;
      background: #030304;
      transform: translateY(100%);
      transition: transform .5s var(--ease);
    }
    .reader.open { transform: translateY(0); }

    .reader-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .85rem 1.5rem;
      border-bottom: 1px solid var(--n-border);
      flex-shrink: 0;
    }
    .reader-label {
      font-family: var(--fm);
      font-size: .56rem;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: rgba(237,237,239,.25);
      max-width: 72%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .reader-close {
      background: none;
      border: 1px solid rgba(200,168,75,.22);
      color: var(--n-gold);
      width: 2.35rem; height: 2.35rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--fm);
      font-size: .8rem;
      transition: background .2s var(--ease), color .2s var(--ease);
      flex-shrink: 0;
    }
    .reader-close:hover { background: var(--n-gold); color: var(--n-bg); }
    .reader-close:focus-visible { outline: 2px solid var(--n-gold); outline-offset: 2px; }

    .reader-frame { flex: 1; width: 100%; border: none; background: #fff; }

    /* ── Footer ──────────────────────────────────────────────── */
    .site-footer {
      text-align: center;
      padding: 2.5rem 1.5rem;
      border-top: 1px solid var(--n-border);
      font-family: var(--fm);
      font-size: .56rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: rgba(237,237,239,.16);
    }
    .site-footer a {
      color: var(--n-gold);
      text-decoration: none;
      opacity: .65;
      transition: opacity .2s;
    }
    .site-footer a:hover { opacity: 1; }

    /* ── Skeleton ────────────────────────────────────────────── */
    .sk {
      background: linear-gradient(
        90deg,
        rgba(255,255,255,.04) 0%,
        rgba(255,255,255,.09) 50%,
        rgba(255,255,255,.04) 100%
      );
      background-size: 400% 100%;
      animation: shimmer 1.7s ease-in-out infinite;
      border-radius: 2px;
    }
    @keyframes shimmer { to { background-position: -400% 0; } }

    /* ── Focus styles ────────────────────────────────────────── */
    :focus-visible { outline: 2px solid var(--n-gold); outline-offset: 3px; }

    /* ════════════════════════════════════════════════════════════
       KEYFRAMES
       ════════════════════════════════════════════════════════════ */
    @keyframes fade-down   { from { opacity:0; transform:translateY(-18px); } to { opacity:1; transform:translateY(0); } }
    @keyframes title-bloom { from { opacity:0; transform:scale(.97) translateY(-10px); } to { opacity:1; transform:scale(1) translateY(0); } }
    @keyframes rule-expand { from { opacity:0; transform:scaleX(.15); } to { opacity:1; transform:scaleX(1); } }
    @keyframes slide-left  { from { opacity:0; transform:translateX(-28px); } to { opacity:1; transform:translateX(0); } }
    @keyframes slide-right { from { opacity:0; transform:translateX(28px);  } to { opacity:1; transform:translateX(0); } }
    @keyframes card-in     { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  </style>
</head>
<body>

  <!-- ── Masthead ───────────────────────────────────────────── -->
  <header class="masthead">
    <p class="masthead-eyebrow">
      <span id="mastheadDate">—</span>
      <b>&nbsp;·&nbsp;</b>
      <span>AI 情報</span>
      <b>&nbsp;·&nbsp;</b>
      <span>深度摘要</span>
    </p>
    <div class="rule rule-top" role="separator"></div>
    <h1 class="pub-title">知<em>識</em>刊</h1>
    <div class="rule rule-bot" role="separator"></div>
    <p class="masthead-sub">
      <span class="pip"></span>
      <span>每日精選</span>
      <span class="pip"></span>
      <span>深度閱讀</span>
      <span class="pip"></span>
    </p>
  </header>

  <!-- ── Hero Split ─────────────────────────────────────────── -->
  <section class="hero-split" aria-label="最新內容">

    <!-- News (left) -->
    <article
      class="hero-news"
      id="heroNews"
      role="button"
      tabindex="0"
      aria-label="開啟最新情報文章"
    >
      <div class="news-blob" aria-hidden="true"></div>
      <div class="bgdate" aria-hidden="true">
        <span class="bgdate-m" id="bgM">06</span>
        <span class="bgdate-d" id="bgD">05</span>
        <span class="bgdate-y" id="bgY">2026</span>
      </div>
      <!-- Content rendered by JS; skeleton shown while loading -->
      <div class="hero-news-inner" id="heroNewsInner">
        <div class="sk" style="height:.7rem;width:7rem;margin-bottom:1.45rem;"></div>
        <div class="sk" style="height:.6rem;width:5.5rem;margin-bottom:.75rem;"></div>
        <div class="sk" style="height:1.9rem;width:88%;margin-bottom:.45rem;"></div>
        <div class="sk" style="height:1.9rem;width:70%;margin-bottom:2.4rem;"></div>
        <div class="sk" style="height:2.3rem;width:6.5rem;"></div>
      </div>
    </article>

    <!-- Summary (right) -->
    <article
      class="hero-summary"
      id="heroSummary"
      role="button"
      tabindex="0"
      aria-label="開啟最新深度摘要"
    >
      <!-- Content rendered by JS -->
    </article>

  </section>

  <!-- ── Archive ───────────────────────────────────────────── -->
  <div class="archive-header" role="separator" aria-label="往期文章">
    <span class="archive-label">往期文章</span>
    <div class="archive-rule"></div>
  </div>
  <section class="archive" aria-label="往期文章列表">
    <div class="archive-grid" id="archiveGrid"></div>
  </section>

  <!-- ── Footer ────────────────────────────────────────────── -->
  <footer class="site-footer">
    知識刊 &nbsp;·&nbsp; 由
    <a href="https://github.com/features/actions" target="_blank" rel="noopener">GitHub Actions</a>
    自動更新
  </footer>

  <!-- ── Reader Overlay ─────────────────────────────────────── -->
  <div
    class="reader"
    id="reader"
    role="dialog"
    aria-modal="true"
    aria-label="文章閱讀器"
  >
    <div class="reader-bar">
      <span class="reader-label" id="readerLabel">知識刊</span>
      <button class="reader-close" id="readerClose" aria-label="關閉閱讀器（Esc）">✕</button>
    </div>
    <iframe
      class="reader-frame"
      id="readerFrame"
      title="文章內容"
      src="about:blank"
    ></iframe>
  </div>

  <script>
    /* ── Helpers ─────────────────────────────────────────────── */
    const $ = id => document.getElementById(id);

    function fmtDate(str) {
      // Output: 2026·06·05  (mono dot-separated, editorial style)
      const [y, m, d] = str.split('-');
      return `${y}·${m.padStart(2,'0')}·${d.padStart(2,'0')}`;
    }

    function splitTitle(t) {
      const i = t.indexOf('|');
      return i === -1
        ? { main: t, sub: null }
        : { main: t.slice(0, i).trim(), sub: t.slice(i + 1).trim() };
    }

    /* ── Reader ─────────────────────────────────────────────── */
    const reader = $('reader'), frame = $('readerFrame');

    function openReader(path, label) {
      $('readerLabel').textContent = label || '知識刊';
      frame.src = path;
      reader.classList.add('open');
      document.body.style.overflow = 'hidden';
      requestAnimationFrame(() => $('readerClose').focus());
    }

    function closeReader() {
      reader.classList.remove('open');
      document.body.style.overflow = '';
      setTimeout(() => { frame.src = 'about:blank'; }, 520);
    }

    $('readerClose').addEventListener('click', closeReader);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeReader(); });

    /* ── Hero: News ──────────────────────────────────────────── */
    function renderHeroNews(item) {
      if (!item) return;
      const [y, m, d] = item.date.split('-');
      $('bgM').textContent = m;
      $('bgD').textContent = d;
      $('bgY').textContent = y;

      $('heroNewsInner').innerHTML = `
        <div class="h-tag">最新情報</div>
        <div class="h-date">${fmtDate(item.date)}</div>
        <h2 class="h-title">${item.title}</h2>
        <span class="h-cta" aria-hidden="true">閱讀全文 &rarr;</span>
      `;

      const el = $('heroNews');
      const go = () => openReader(item.path, item.title);
      el.addEventListener('click', go);
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    }

    /* ── Hero: Summary ───────────────────────────────────────── */
    function renderHeroSummary(item) {
      const el = $('heroSummary');
      if (!item) {
        el.innerHTML = '<div class="sum-fallback"></div>';
        return;
      }

      const { main, sub } = splitTitle(item.title);
      const firstChar = main.charAt(0);

      const media = item.hero
        ? `<img class="sum-img" src="${item.hero}" alt="" role="presentation" loading="eager">`
        : `<div class="sum-fallback" data-char="${firstChar}"></div>`;

      el.innerHTML = `
        ${media}
        <div class="sum-overlay" aria-hidden="true"></div>
        <div class="hero-sum-content">
          <div class="h-tag">深度摘要</div>
          <div class="h-date">${fmtDate(item.date)}</div>
          <h2 class="h-title">${main}${sub ? `<span class="h-sub">${sub}</span>` : ''}</h2>
          <span class="h-cta" aria-hidden="true">閱讀全文 &rarr;</span>
        </div>
      `;

      const go = () => openReader(item.path, main);
      el.addEventListener('click', go);
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    }

    /* ── Intersection Observer — staggered card entrance ─────── */
    let staggerDelay = 0;
    const io = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        entry.target.style.animationDelay = `${staggerDelay}ms`;
        entry.target.classList.add('visible');
        staggerDelay = Math.min(staggerDelay + 48, 280); // cap at 280ms
        io.unobserve(entry.target);
      });
    }, { threshold: 0.06 });

    /* ── Archive ─────────────────────────────────────────────── */
    function renderArchive(news, summary) {
      const grid = $('archiveGrid');
      const na = news.slice(1), sa = summary.slice(1);
      const items = [];
      const max = Math.max(na.length, sa.length);
      for (let i = 0; i < max; i++) {
        if (sa[i]) items.push({ ...sa[i], type: 'summary' });
        if (na[i]) items.push({ ...na[i], type: 'news' });
      }

      if (!items.length) {
        grid.innerHTML = '<p style="grid-column:1/-1;padding:3rem;font-family:var(--fm);font-size:.72rem;opacity:.28;letter-spacing:.1em;">暫無往期文章</p>';
        return;
      }

      const frag = document.createDocumentFragment();
      items.forEach(item => {
        const { main, sub } = splitTitle(item.title);
        const card = document.createElement('article');
        card.className = `card card--${item.type}`;
        card.setAttribute('role', 'button');
        card.setAttribute('tabindex', '0');
        card.setAttribute('aria-label', `開啟：${main}`);

        const thumb = item.type === 'summary' && item.hero
          ? `<img class="card-thumb" src="${item.hero}" alt="" role="presentation" loading="lazy">`
          : '';

        card.innerHTML = `
          ${thumb}
          <div class="card-tag">${item.type === 'news' ? 'AI 情報' : '深度摘要'}</div>
          <div class="card-date">${fmtDate(item.date)}</div>
          <h3 class="card-title">${main}${sub ? `<span class="card-sub">${sub}</span>` : ''}</h3>
          <span class="card-arrow" aria-hidden="true">&rarr;</span>
        `;

        const go = () => openReader(item.path, main);
        card.addEventListener('click', go);
        card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });

        frag.appendChild(card);
        io.observe(card);
      });

      grid.appendChild(frag);
    }

    /* ── Masthead date ───────────────────────────────────────── */
    function setDate() {
      const n = new Date();
      $('mastheadDate').textContent =
        `${n.getFullYear()}·${String(n.getMonth()+1).padStart(2,'0')}·${String(n.getDate()).padStart(2,'0')}`;
    }

    /* ── Init ────────────────────────────────────────────────── */
    async function init() {
      setDate();

      let manifest;
      try {
        const res = await fetch('manifest.json');
        if (!res.ok) throw new Error(res.status);
        manifest = await res.json();
      } catch {
        $('heroNewsInner').innerHTML = `
          <p style="font-family:var(--fm);font-size:.72rem;color:rgba(200,168,75,.5);line-height:1.9;letter-spacing:.04em">
            無法載入 manifest.json<br>
            請用本機伺服器開啟，或執行：<br>
            <code style="opacity:.65">python scripts/build_manifest.py</code>
          </p>`;
        return;
      }

      const { news = [], summary = [] } = manifest;
      renderHeroNews(news[0]);
      renderHeroSummary(summary[0]);
      renderArchive(news, summary);
    }

    init();
  </script>
</body>
</html>
