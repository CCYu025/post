<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>知識刊 — AI 情報 & 深度摘要</title>
  <meta name="description" content="每日 AI 情報精選與深度主題摘要，知識刊為你整理最重要的訊息。">

  <!-- Triple font stack: display / editorial serif / mono labels -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Libre+Bodoni:ital,wght@0,400;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,700;1,900&display=swap" rel="stylesheet">

  <style>
    /* ── Design Tokens ───────────────────────────────────────── */
    :root {
      /* News side — cinematic dark */
      --n-bg:      #030304;
      --n-surface: #0b0b0d;
      --n-text:    #ededef;
      --n-muted:   rgba(237,237,239,.32);
      --n-gold:    #c8a84b;
      --n-gold-t:  rgba(200,168,75,.10);
      --n-border:  rgba(200,168,75,.07);

      /* Summary side — warm editorial */
      --s-bg:      #f4efe6;
      --s-surface: #fffdf8;
      --s-text:    #18181b;
      --s-green:   #2d4a3e;
      --s-sage:    #52756a;

      /* Typography */
      --fd: 'Playfair Display', Georgia, 'Times New Roman', serif;
      --fs: 'Libre Bodoni', Georgia, serif;
      --fm: 'JetBrains Mono', 'Courier New', monospace;

      /* Motion — Expo Out (iOS/Framer premium feel) */
      --ease: cubic-bezier(.16,1,.3,1);

      /* Future theme fallback accent colours */
      --t-alt1: #7b9eb8;
      --t-alt2: #b87b9e;
    }

    /* ── Reset ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      background: var(--n-bg);
      color: var(--n-text);
      font-family: var(--fs);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    img { display: block; max-width: 100%; }
    button { cursor: pointer; font-family: inherit; }

    /* ── Reduced Motion ──────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

    /* ════════════════════════════════════════════════════════════
       MASTHEAD
       ════════════════════════════════════════════════════════════ */
    .masthead {
      position: relative;
      text-align: center;
      padding: 2.75rem 2rem 2.25rem;
      overflow: hidden;
      animation: fade-down 1s var(--ease) both;
    }

    /* Corner vignette glow */
    .masthead::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 80% at 0% 0%, rgba(200,168,75,.05), transparent),
        radial-gradient(ellipse 60% 80% at 100% 0%, rgba(200,168,75,.05), transparent);
      pointer-events: none;
    }

    .masthead-eyebrow {
      font-family: var(--fm);
      font-size: .6rem;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: rgba(237,237,239,.25);
      margin-bottom: 1.2rem;
    }
    .masthead-eyebrow b { color: var(--n-gold); font-weight: 500; }

    /* Animated rule */
    .rule {
      max-width: 840px;
      margin: 0 auto;
      height: 1px;
      background: linear-gradient(90deg,
        transparent 0%, var(--n-gold) 28%, var(--n-gold) 72%, transparent 100%);
      transform-origin: center;
    }
    .rule-top {
      margin-bottom: 1.15rem;
      animation: rule-expand .9s .2s var(--ease) both;
    }
    .rule-bot {
      margin-top: 1.15rem;
      animation: rule-expand .9s .25s var(--ease) both;
    }

    .pub-title {
      font-family: var(--fd);
      font-size: clamp(4.2rem, 13vw, 10.5rem);
      font-weight: 900;
      font-style: italic;
      letter-spacing: .04em;
      line-height: .93;
      color: var(--n-text);
      animation: title-bloom 1.1s .08s var(--ease) both;
    }
    .pub-title em {
      font-style: normal;
      color: var(--n-gold);
      position: relative;
    }
    /* Thin underline on 識 */
    .pub-title em::after {
      content: '';
      position: absolute;
      bottom: .08em;
      left: 0; right: 0;
      height: .07em;
      background: var(--n-gold);
      opacity: .45;
    }

    .masthead-sub {
      margin-top: .6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      font-family: var(--fm);
      font-size: .58rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: rgba(237,237,239,.25);
    }
    .masthead-sub .pip {
      display: inline-block;
      width: 3px; height: 3px;
      border-radius: 50%;
      background: var(--n-gold);
      opacity: .55;
    }
    #mastheadDate { color: rgba(237,237,239,.45); }

    /* ════════════════════════════════════════════════════════════
       HERO SPLIT
       ════════════════════════════════════════════════════════════ */
    .hero-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 87vh;
      border-top: 1px solid var(--n-border);
      border-bottom: 1px solid var(--n-border);
    }
    @media (max-width: 680px) {
      .hero-split { grid-template-columns: 1fr; min-height: auto; }

      /* News panel: give it a natural height from content + cap the padding */
      .hero-news {
        padding: 2.5rem 1.75rem 3rem;
        min-height: 72vw;
      }
      /* Background date glyphs: too big on narrow screens */
      .bgdate-m, .bgdate-d { font-size: clamp(5rem, 22vw, 8rem); }
      .bgdate-y { font-size: clamp(1.2rem, 4.5vw, 2rem); }

      /* Summary panel collapses because all children are position:absolute —
         give it an explicit min-height so it is visible when stacked */
      .hero-summary { min-height: 78vw; }
      .hero-sum-content { padding: 2.5rem 1.75rem 3rem; }

      /* Masthead title: clamp min is 4.2rem which is fine on mobile */
      .masthead { padding: 2rem 1.5rem 1.75rem; }

      /* Archive paddings */
      .archive-header { padding: 3rem 1.25rem 0; }
      .archive { padding: 1.75rem 1.25rem 5rem; }
    }

    /* ── Hero: News (left) ───────────────────────────────────── */
    .hero-news {
      position: relative;
      padding: 3.5rem 3.25rem 4.25rem;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background: var(--n-bg);
      border-right: 1px solid var(--n-border);
      cursor: pointer;
      overflow: hidden;
      animation: slide-left .9s .12s var(--ease) both;
      transition: background .3s var(--ease);
    }
    .hero-news:hover { background: #050508; }

    /* Diagonal cross-hatch texture */
    .hero-news::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        repeating-linear-gradient(
          45deg, transparent, transparent 28px,
          rgba(200,168,75,.014) 28px, rgba(200,168,75,.014) 29px
        ),
        repeating-linear-gradient(
          -45deg, transparent, transparent 28px,
          rgba(200,168,75,.014) 28px, rgba(200,168,75,.014) 29px
        );
      pointer-events: none;
    }

    /* Animated ambient gold blob */
    .news-blob {
      position: absolute;
      width: 60%;
      aspect-ratio: 1;
      top: 10%; left: -15%;
      background: radial-gradient(circle, rgba(200,168,75,.085) 0%, transparent 68%);
      border-radius: 50%;
      animation: blob 11s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes blob {
      0%   { transform: translate(0,0) scale(1); }
      100% { transform: translate(55px,-35px) scale(1.15); }
    }

    /* Giant background date */
    .bgdate {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: var(--fd);
      font-weight: 900;
      line-height: .80;
      color: rgba(200,168,75,.038);
      pointer-events: none;
      user-select: none;
    }
    .bgdate-m, .bgdate-d { font-size: clamp(8rem, 17vw, 16rem); }
    .bgdate-y {
      font-size: clamp(1.8rem, 4vw, 3.8rem);
      letter-spacing: .2em;
      margin-top: .6rem;
      opacity: .7;
    }

    /* ── Shared hero label system ────────────────────────────── */
    .h-tag {
      font-family: var(--fm);
      font-size: .72rem;
      letter-spacing: .32em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: .9rem;
      margin-bottom: 1.45rem;
    }
    .h-tag::before {
      content: '';
      width: 2.4rem; height: 1px;
      background: currentColor;
      flex-shrink: 0;
    }
    .hero-news .h-tag   { color: var(--n-gold); }
    .hero-sum-content .h-tag { color: rgba(244,239,230,.52); }

    .h-date {
      font-family: var(--fm);
      font-size: .7rem;
      letter-spacing: .14em;
      margin-bottom: .75rem;
    }
    .hero-news .h-date   { color: var(--n-muted); }
    .hero-sum-content .h-date { color: rgba(244,239,230,.36); }

    .h-title {
      font-family: var(--fd);
      font-weight: 700;
      font-size: clamp(1.55rem, 2.7vw, 2.55rem);
      line-height: 1.22;
      margin-bottom: 2.4rem;
    }
    .hero-news .h-title {
      color: var(--n-text);
      transition: color .28s var(--ease);
    }
    .hero-news:hover .h-title { color: var(--n-gold); }
    .hero-sum-content .h-title { color: #f0ead8; }

    .h-sub {
      display: block;
      font-size: .76em;
      font-weight: 400;
      font-style: italic;
      opacity: .5;
      margin-top: .35rem;
    }

    .h-cta {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      font-family: var(--fm);
      font-size: .58rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      border: 1px solid currentColor;
      padding: .65rem 1.45rem;
      transition: background .22s var(--ease), color .22s var(--ease);
      align-self: flex-start;
      user-select: none;
    }
    .hero-news .h-cta   { color: var(--n-gold); }
    .hero-news:hover .h-cta { background: var(--n-gold); color: var(--n-bg); }
    .hero-summary .h-cta { color: rgba(244,239,230,.62); }
    .hero-summary:hover .h-cta {
      background: var(--s-surface);
      color: var(--s-green);
      border-color: var(--s-surface);
    }

    /* Inner content wrapper — sits above blobs */
    .hero-news-inner { position: relative; z-index: 1; }

    /* ── Hero: Summary (right) ───────────────────────────────── */
    .hero-summary {
      position: relative;
      overflow: hidden;
      cursor: pointer;
      background: var(--s-green);
      animation: slide-right .9s .12s var(--ease) both;
    }

    .sum-img {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      filter: brightness(.76) saturate(.82);
      transition: transform .7s var(--ease), filter .5s var(--ease);
    }
    .hero-summary:hover .sum-img {
      transform: scale(1.055);
      filter: brightness(.7) saturate(.88);
    }

    .sum-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(15,30,23,.98) 0%,
        rgba(15,30,23,.58) 38%,
        rgba(15,30,23,.12) 68%,
        transparent 100%
      );
    }

    /* Fallback gradient when no image */
    .sum-fallback {
      position: absolute;
      inset: 0;
      background: linear-gradient(148deg, #2d4a3e 0%, #162a22 52%, #3d6b5a 100%);
    }
    .sum-fallback::after {
      content: attr(data-char);
      position: absolute;
      bottom: -.08em; right: -.04em;
      font-family: var(--fd);
      font-size: clamp(12rem, 28vw, 22rem);
      font-weight: 900;
      line-height: 1;
      color: rgba(244,239,230,.046);
      user-select: none;
      pointer-events: none;
    }

    .hero-sum-content {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 3.5rem 3.25rem 4.25rem;
      z-index: 1;
    }

    /* ════════════════════════════════════════════════════════════
       ARCHIVE
       ════════════════════════════════════════════════════════════ */
    .archive-header {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 3.75rem 2rem 0;
      max-width: 1320px;
      margin: 0 auto;
    }
    .archive-label {
      font-family: var(--fm);
      font-size: .78rem;
      letter-spacing: .34em;
      text-transform: uppercase;
      color: rgba(237,237,239,.22);
      white-space: nowrap;
    }
    .archive-rule {
      flex: 1; height: 1px;
      background: var(--n-border);
    }

    .archive { padding: 2rem 2rem 6rem; }

    .archive-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1px;
      max-width: 1320px;
      margin: 0 auto;
      background: var(--n-border);
    }

    /* ── Card ────────────────────────────────────────────────── */
    .card {
      padding: 2rem 2.25rem 2.6rem;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition:
        background .25s var(--ease),
        transform .18s var(--ease);
      /* Initial state for stagger-in animation */
      opacity: 0;
      transform: translateY(16px);
    }
    .card.visible {
      animation: card-in .52s var(--ease) both;
    }
    .card:active { transform: scale(0.975); }

    .card--news {
      background: var(--n-surface);
      border-left: 2px solid rgba(200,168,75,.12);
    }
    .card--summary { background: var(--s-bg); }

    .card--news:hover {
      background: #101014;
      border-left-color: rgba(200,168,75,.28);
    }
    .card--summary:hover { background: #ede8df; }

    /* Thumbnail for summary cards */
    .card-thumb {
      width: calc(100% + 4.5rem);
      height: 128px;
      object-fit: cover;
      margin: -2rem -2.25rem 1.5rem;
      filter: brightness(.86) saturate(.8);
      transition: filter .28s var(--ease);
    }
    .card--summary:hover .card-thumb { filter: brightness(.94) saturate(.95); }

    .card-tag {
      font-family: var(--fm);
      font-size: .68rem;
      letter-spacing: .3em;
      text-transform: uppercase;
      margin-bottom: .7rem;
    }
    .card--news    .card-tag { color: var(--n-gold); }
    .card--summary .card-tag { color: var(--s-sage); }

    .card-date {
      font-family: var(--fm);
      font-size: .76rem;
      letter-spacing: .12em;
      margin-bottom: .5rem;
    }
    .card--news    .card-date { color: rgba(237,237,239,.26); }
    .card--summary .card-date { color: var(--s-sage); }

    .card-title {
      font-family: var(--fs);
      font-weight: 700;
      font-size: 1.15rem;
      line-height: 1.48;
    }
    .card--news    .card-title { color: var(--n-text); }
    .card--summary .card-title { color: var(--s-text); }

    .card-sub {
      display: block;
      font-size: .78em;
      font-weight: 400;
      font-style: italic;
      opacity: .48;
      margin-top: .22rem;
    }

    /* Arrow appears on hover */
    .card-arrow {
      position: absolute;
      bottom: 1.35rem; right: 1.5rem;
      font-family: var(--fm);
      font-size: .8rem;
      opacity: 0;
      transform: translate(-7px, 5px);
      transition: opacity .2s var(--ease), transform .2s var(--ease);
    }
    .card--news    .card-arrow { color: var(--n-gold); }
    .card--summary .card-arrow { color: var(--s-green); }
    .card:hover .card-arrow { opacity: 1; transform: translate(0,0); }

    /* Alt-theme card tags (3rd+ themes) */
    .card-tag--alt1 { color: var(--t-alt1); }
    .card-tag--alt2 { color: var(--t-alt2); }

    /* ── Archive More Button ─────────────────────────────────── */
    .archive-more {
      max-width: 1320px;
      margin: 2.25rem auto 0;
      display: flex;
      justify-content: center;
      padding: 0 2rem;
    }
    .archive-more-btn {
      font-family: var(--fm);
      font-size: .72rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: rgba(237,237,239,.32);
      background: none;
      border: 1px solid rgba(200,168,75,.14);
      padding: .75rem 2.4rem;
      transition:
        color .22s var(--ease),
        border-color .22s var(--ease),
        background .22s var(--ease);
    }
    .archive-more-btn:hover {
      color: var(--n-gold);
      border-color: rgba(200,168,75,.42);
      background: rgba(200,168,75,.04);
    }

    /* ════════════════════════════════════════════════════════════
       HAMBURGER BUTTON
       ════════════════════════════════════════════════════════════ */
    .hamburger {
      position: fixed;
      top: 1.1rem;
      right: 1.25rem;
      z-index: 800;
      width: 2.5rem;
      height: 2.5rem;
      background: rgba(3,3,4,.82);
      border: 1px solid rgba(200,168,75,.18);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .38rem;
      transition: border-color .22s var(--ease), background .22s var(--ease);
    }
    .hamburger:hover { border-color: rgba(200,168,75,.45); }
    .hamburger[aria-expanded="true"] {
      border-color: var(--n-gold);
      z-index: 840;
    }
    .ham-bar {
      display: block;
      width: 1.1rem;
      height: 1px;
      background: var(--n-gold);
      transition: transform .28s var(--ease), opacity .2s var(--ease);
      transform-origin: center;
    }
    .hamburger[aria-expanded="true"] .ham-bar:nth-child(1) {
      transform: translateY(.39rem) rotate(45deg);
    }
    .hamburger[aria-expanded="true"] .ham-bar:nth-child(2) {
      opacity: 0;
      transform: scaleX(0);
    }
    .hamburger[aria-expanded="true"] .ham-bar:nth-child(3) {
      transform: translateY(-.39rem) rotate(-45deg);
    }

    /* ════════════════════════════════════════════════════════════
       LIBRARY OVERLAY
       ════════════════════════════════════════════════════════════ */
    .library {
      position: fixed;
      inset: 0;
      z-index: 850;
      background: #050508;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transform: translateY(20px) scale(.99);
      pointer-events: none;
      transition:
        opacity .38s var(--ease),
        transform .38s var(--ease);
    }
    .library.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    /* Header bar */
    .lib-header {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      padding: .95rem 1.5rem;
      border-bottom: 1px solid var(--n-border);
      flex-shrink: 0;
    }
    .lib-title {
      font-family: var(--fd);
      font-size: 1.05rem;
      font-style: italic;
      color: var(--n-text);
      flex-shrink: 0;
      letter-spacing: .02em;
    }
    .lib-search-wrap { flex: 1; }
    .lib-search {
      width: 100%;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(200,168,75,.12);
      color: var(--n-text);
      font-family: var(--fm);
      font-size: .76rem;
      letter-spacing: .05em;
      padding: .48rem 1rem;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      border-radius: 0;
      transition: border-color .2s var(--ease);
    }
    .lib-search:focus { border-color: rgba(200,168,75,.38); }
    .lib-search::placeholder { color: rgba(237,237,239,.2); }
    .lib-search::-webkit-search-decoration,
    .lib-search::-webkit-search-cancel-button { display: none; }

    .lib-close {
      background: none;
      border: 1px solid rgba(200,168,75,.22);
      color: var(--n-gold);
      width: 2.35rem;
      height: 2.35rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--fm);
      font-size: .8rem;
      flex-shrink: 0;
      transition: background .2s var(--ease), color .2s var(--ease);
    }
    .lib-close:hover { background: var(--n-gold); color: var(--n-bg); }

    /* Scrollable body */
    .lib-body {
      flex: 1;
      overflow-y: auto;
      padding: 1.75rem 2rem 5rem;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(200,168,75,.2) transparent;
    }
    .lib-body::-webkit-scrollbar { width: 4px; }
    .lib-body::-webkit-scrollbar-track { background: transparent; }
    .lib-body::-webkit-scrollbar-thumb { background: rgba(200,168,75,.2); border-radius: 2px; }

    /* Year-month group */
    .lib-group { margin-bottom: 2.25rem; }
    .lib-group[style*="display: none"] { display: none !important; }

    .lib-group-toggle {
      width: 100%;
      background: none;
      border: none;
      display: flex;
      align-items: baseline;
      gap: .65rem;
      padding: .5rem 0 .6rem;
      border-bottom: 1px solid var(--n-border);
      margin-bottom: .5rem;
      cursor: pointer;
      transition: opacity .18s;
    }
    .lib-group-toggle:hover { opacity: .72; }

    .lib-group-yr {
      font-family: var(--fd);
      font-size: 1.3rem;
      font-style: italic;
      color: var(--n-text);
    }
    .lib-group-mo {
      font-family: var(--fd);
      font-size: .9rem;
      color: rgba(237,237,239,.45);
    }
    .lib-group-count {
      font-family: var(--fm);
      font-size: .6rem;
      letter-spacing: .1em;
      color: rgba(200,168,75,.45);
      margin-left: .25rem;
    }
    .lib-toggle-icon {
      font-size: .65rem;
      color: rgba(200,168,75,.5);
      margin-left: auto;
      transition: transform .28s var(--ease);
      display: inline-block;
    }
    .lib-group-toggle[aria-expanded="false"] .lib-toggle-icon {
      transform: rotate(-90deg);
    }

    /* Collapsible list */
    .lib-list {
      list-style: none;
      display: grid;
      grid-template-rows: 1fr;
      overflow: hidden;
      transition: grid-template-rows .32s var(--ease);
    }
    .lib-list.collapsed { grid-template-rows: 0fr; }
    .lib-list > * { min-height: 0; }

    /* Article item */
    .lib-item {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: start;
      gap: .3rem .9rem;
      padding: .62rem .4rem;
      border-bottom: 1px solid rgba(200,168,75,.04);
      cursor: pointer;
      border-radius: 2px;
      transition: background .16s var(--ease);
    }
    .lib-item:hover { background: rgba(200,168,75,.05); }

    .lib-item-meta {
      display: flex;
      align-items: center;
      gap: .55rem;
      padding-top: .12rem;
    }
    .lib-item-tag {
      font-family: var(--fm);
      font-size: .58rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .lib-item-tag--news    { color: var(--n-gold); }
    .lib-item-tag--summary { color: var(--s-sage); }
    .lib-item-tag--alt1    { color: var(--t-alt1); }
    .lib-item-tag--alt2    { color: var(--t-alt2); }

    .lib-item-date {
      font-family: var(--fm);
      font-size: .6rem;
      letter-spacing: .07em;
      color: rgba(237,237,239,.25);
      white-space: nowrap;
    }

    .lib-item-title {
      font-family: var(--fs);
      font-size: .94rem;
      font-weight: 600;
      line-height: 1.45;
      color: rgba(237,237,239,.82);
      transition: color .16s var(--ease);
    }
    .lib-item:hover .lib-item-title { color: var(--n-text); }

    .lib-item-title mark {
      background: rgba(200,168,75,.22);
      color: var(--n-gold);
      border-radius: 1px;
    }

    .lib-empty {
      font-family: var(--fm);
      font-size: .72rem;
      letter-spacing: .1em;
      color: rgba(237,237,239,.18);
      text-align: center;
      padding: 4rem 2rem;
    }

    /* Mobile */
    @media (max-width: 680px) {
      .lib-header { padding: .85rem 1rem; gap: .75rem; }
      .lib-title  { font-size: .88rem; }
      .lib-body   { padding: 1.25rem 1rem 4rem; }
      .lib-item   { grid-template-columns: 1fr; gap: .25rem; }
      .lib-item-meta { flex-wrap: wrap; }
    }

    /* ════════════════════════════════════════════════════════════
       READER OVERLAY
       ════════════════════════════════════════════════════════════ */
    .reader {
      position: fixed;
      inset: 0;
      z-index: 900;
      display: flex;
      flex-direction: column;
      background: #030304;
      transform: translateY(100%);
      transition: transform .5s var(--ease);
    }
    .reader.open { transform: translateY(0); }

    .reader-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .85rem 1.5rem;
      border-bottom: 1px solid var(--n-border);
      flex-shrink: 0;
    }
    .reader-label {
      font-family: var(--fm);
      font-size: .56rem;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: rgba(237,237,239,.25);
      max-width: 72%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .reader-close {
      background: none;
      border: 1px solid rgba(200,168,75,.22);
      color: var(--n-gold);
      width: 2.35rem; height: 2.35rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--fm);
      font-size: .8rem;
      transition: background .2s var(--ease), color .2s var(--ease);
      flex-shrink: 0;
    }
    .reader-close:hover { background: var(--n-gold); color: var(--n-bg); }
    .reader-close:focus-visible { outline: 2px solid var(--n-gold); outline-offset: 2px; }

    .reader-frame { flex: 1; width: 100%; border: none; background: #fff; }

    /* ── Footer ──────────────────────────────────────────────── */
    .site-footer {
      text-align: center;
      padding: 2.5rem 1.5rem;
      border-top: 1px solid var(--n-border);
      font-family: var(--fm);
      font-size: .56rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: rgba(237,237,239,.16);
    }
    .site-footer a {
      color: var(--n-gold);
      text-decoration: none;
      opacity: .65;
      transition: opacity .2s;
    }
    .site-footer a:hover { opacity: 1; }

    /* ── Skeleton ────────────────────────────────────────────── */
    .sk {
      background: linear-gradient(
        90deg,
        rgba(255,255,255,.04) 0%,
        rgba(255,255,255,.09) 50%,
        rgba(255,255,255,.04) 100%
      );
      background-size: 400% 100%;
      animation: shimmer 1.7s ease-in-out infinite;
      border-radius: 2px;
    }
    @keyframes shimmer { to { background-position: -400% 0; } }

    /* ── Focus styles ────────────────────────────────────────── */
    :focus-visible { outline: 2px solid var(--n-gold); outline-offset: 3px; }

    /* ════════════════════════════════════════════════════════════
       KEYFRAMES
       ════════════════════════════════════════════════════════════ */
    @keyframes fade-down   { from { opacity:0; transform:translateY(-18px); } to { opacity:1; transform:translateY(0); } }
    @keyframes title-bloom { from { opacity:0; transform:scale(.97) translateY(-10px); } to { opacity:1; transform:scale(1) translateY(0); } }
    @keyframes rule-expand { from { opacity:0; transform:scaleX(.15); } to { opacity:1; transform:scaleX(1); } }
    @keyframes slide-left  { from { opacity:0; transform:translateX(-28px); } to { opacity:1; transform:translateX(0); } }
    @keyframes slide-right { from { opacity:0; transform:translateX(28px);  } to { opacity:1; transform:translateX(0); } }
    @keyframes card-in     { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  </style>
</head>
<body>

  <!-- ── Masthead ───────────────────────────────────────────── -->
  <header class="masthead">
    <p class="masthead-eyebrow">
      <span id="mastheadDate">—</span>
      <b>&nbsp;·&nbsp;</b>
      <span>AI 情報</span>
      <b>&nbsp;·&nbsp;</b>
      <span>深度摘要</span>
    </p>
    <div class="rule rule-top" role="separator"></div>
    <h1 class="pub-title">知<em>識</em>刊</h1>
    <div class="rule rule-bot" role="separator"></div>
    <p class="masthead-sub">
      <span class="pip"></span>
      <span>每日精選</span>
      <span class="pip"></span>
      <span>深度閱讀</span>
      <span class="pip"></span>
    </p>
  </header>

  <!-- ── Hero Split ─────────────────────────────────────────── -->
  <section class="hero-split" aria-label="最新內容">

    <!-- News (left) -->
    <article
      class="hero-news"
      id="heroNews"
      role="button"
      tabindex="0"
      aria-label="開啟最新情報文章"
    >
      <div class="news-blob" aria-hidden="true"></div>
      <div class="bgdate" aria-hidden="true">
        <span class="bgdate-m" id="bgM">06</span>
        <span class="bgdate-d" id="bgD">05</span>
        <span class="bgdate-y" id="bgY">2026</span>
      </div>
      <!-- Content rendered by JS; skeleton shown while loading -->
      <div class="hero-news-inner" id="heroNewsInner">
        <div class="sk" style="height:.7rem;width:7rem;margin-bottom:1.45rem;"></div>
        <div class="sk" style="height:.6rem;width:5.5rem;margin-bottom:.75rem;"></div>
        <div class="sk" style="height:1.9rem;width:88%;margin-bottom:.45rem;"></div>
        <div class="sk" style="height:1.9rem;width:70%;margin-bottom:2.4rem;"></div>
        <div class="sk" style="height:2.3rem;width:6.5rem;"></div>
      </div>
    </article>

    <!-- Summary (right) -->
    <article
      class="hero-summary"
      id="heroSummary"
      role="button"
      tabindex="0"
      aria-label="開啟最新深度摘要"
    >
      <!-- Content rendered by JS -->
    </article>

  </section>

  <!-- ── Archive ───────────────────────────────────────────── -->
  <div class="archive-header" role="separator" aria-label="往期文章">
    <span class="archive-label">往期文章</span>
    <div class="archive-rule"></div>
  </div>
  <section class="archive" aria-label="往期文章列表">
    <div class="archive-grid" id="archiveGrid"></div>
    <div class="archive-more">
      <button class="archive-more-btn" id="archiveMoreBtn" aria-label="開啟文章庫，瀏覽全部往期文章">
        查看全部往期 &rarr;
      </button>
    </div>
  </section>

  <!-- ── Footer ────────────────────────────────────────────── -->
  <footer class="site-footer">
    知識刊 &nbsp;·&nbsp; 由
    <a href="https://github.com/features/actions" target="_blank" rel="noopener">GitHub Actions</a>
    自動更新
  </footer>

  <!-- ── Hamburger Button ──────────────────────────────────── -->
  <button
    class="hamburger"
    id="hamburger"
    aria-label="開啟文章庫"
    aria-expanded="false"
    aria-controls="library"
  >
    <span class="ham-bar"></span>
    <span class="ham-bar"></span>
    <span class="ham-bar"></span>
  </button>

  <!-- ── Library Overlay ───────────────────────────────────── -->
  <div
    class="library"
    id="library"
    role="dialog"
    aria-modal="true"
    aria-label="文章庫"
  >
    <div class="lib-header">
      <span class="lib-title">文章庫</span>
      <div class="lib-search-wrap">
        <input
          class="lib-search"
          id="libSearch"
          type="search"
          placeholder="搜尋標題…"
          aria-label="搜尋文章"
          autocomplete="off"
        >
      </div>
      <button class="lib-close" id="libClose" aria-label="關閉文章庫（Esc）">✕</button>
    </div>
    <div class="lib-body" id="libBody"></div>
  </div>

  <!-- ── Reader Overlay ─────────────────────────────────────── -->
  <div
    class="reader"
    id="reader"
    role="dialog"
    aria-modal="true"
    aria-label="文章閱讀器"
  >
    <div class="reader-bar">
      <span class="reader-label" id="readerLabel">知識刊</span>
      <button class="reader-close" id="readerClose" aria-label="關閉閱讀器（Esc）">✕</button>
    </div>
    <iframe
      class="reader-frame"
      id="readerFrame"
      title="文章內容"
      src="about:blank"
    ></iframe>
  </div>

  <script>
    /* ── Helpers ─────────────────────────────────────────────── */
    const $ = id => document.getElementById(id);

    function fmtDate(str) {
      // Output: 2026·06·05  (mono dot-separated, editorial style)
      const [y, m, d] = str.split('-');
      return `${y}·${m.padStart(2,'0')}·${d.padStart(2,'0')}`;
    }

    function splitTitle(t) {
      const i = t.indexOf('|');
      return i === -1
        ? { main: t, sub: null }
        : { main: t.slice(0, i).trim(), sub: t.slice(i + 1).trim() };
    }

    /* ── Body scroll lock (shared by Reader + Library) ──────── */
    function setBodyLock() {
      const anyOpen = [$('reader'), $('library')].some(el => el && el.classList.contains('open'));
      document.body.style.overflow = anyOpen ? 'hidden' : '';
    }

    /* ── Reader ─────────────────────────────────────────────── */
    const reader = $('reader'), frame = $('readerFrame');

    function openReader(path, label) {
      $('readerLabel').textContent = label || '知識刊';
      frame.src = path;
      reader.classList.add('open');
      setBodyLock();
      requestAnimationFrame(() => $('readerClose').focus());
    }

    function closeReader() {
      reader.classList.remove('open');
      setTimeout(() => { frame.src = 'about:blank'; }, 520);
      setBodyLock();
    }

    $('readerClose').addEventListener('click', closeReader);
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      if ($('reader').classList.contains('open')) closeReader();
      else if ($('library') && $('library').classList.contains('open')) closeLibrary();
    });

    /* ── Library Overlay ─────────────────────────────────────── */
    let _libraryRendered = false;
    let _searchTimer = null;
    let _libraryItems = [];

    const MONTH_NAMES = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];

    function buildLibraryData(mf) {
      return Object.entries(mf)
        .flatMap(([key, arr], idx) => arr.map(item => ({ ...item, _key: key, _idx: idx })))
        .sort((a, b) => b.date.localeCompare(a.date));
    }

    function groupByYearMonth(items) {
      const map = new Map();
      items.forEach(item => {
        const ym = item.date.slice(0, 7); // "YYYY-MM"
        if (!map.has(ym)) map.set(ym, []);
        map.get(ym).push(item);
      });
      return map;
    }

    function libTagCls(key) {
      if (key === 'news') return 'lib-item-tag--news';
      if (key === 'summary') return 'lib-item-tag--summary';
      return 'lib-item-tag--alt1';
    }

    function libTagLabel(key, idx) {
      return getThemeMeta(key, idx).label || key;
    }

    function highlight(text, query) {
      if (!query) return text;
      const re = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
      return text.replace(re, '<mark>$1</mark>');
    }

    function renderLibrary() {
      if (!manifest) return;
      _libraryItems = buildLibraryData(manifest);
      const grouped = groupByYearMonth(_libraryItems);
      const body = $('libBody');
      body.innerHTML = '';
      const frag = document.createDocumentFragment();
      let first = true;
      grouped.forEach((items, ym) => {
        const [yr, mo] = ym.split('-');
        const moName = MONTH_NAMES[parseInt(mo, 10) - 1];
        const groupId = `lg-${ym}`;
        const isOpen = first;
        first = false;

        const sec = document.createElement('section');
        sec.className = 'lib-group';
        sec.dataset.group = ym;

        const toggleBtn = document.createElement('button');
        toggleBtn.className = 'lib-group-toggle';
        toggleBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        toggleBtn.setAttribute('aria-controls', groupId);
        toggleBtn.innerHTML = `
          <span class="lib-group-yr">${yr}</span>
          <span class="lib-group-mo">${moName}</span>
          <span class="lib-group-count">${items.length}</span>
          <span class="lib-toggle-icon" aria-hidden="true">&#9662;</span>
        `;
        toggleBtn.addEventListener('click', () => toggleLibGroup(toggleBtn));

        const ul = document.createElement('ul');
        ul.className = 'lib-list' + (isOpen ? '' : ' collapsed');
        ul.id = groupId;
        ul.setAttribute('role', 'list');

        items.forEach(item => {
          const { main } = splitTitle(item.title);
          const li = document.createElement('li');
          li.className = 'lib-item';
          li.setAttribute('tabindex', '0');
          li.dataset.title = main.toLowerCase();
          li.dataset.rawTitle = main;
          li.innerHTML = `
            <span class="lib-item-meta">
              <span class="lib-item-tag ${libTagCls(item._key)}">${libTagLabel(item._key, item._idx)}</span>
              <span class="lib-item-date">${fmtDate(item.date)}</span>
            </span>
            <span class="lib-item-title">${main}</span>
          `;
          const go = () => openReader(item.path, main);
          li.addEventListener('click', go);
          li.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
          ul.appendChild(li);
        });

        sec.appendChild(toggleBtn);
        sec.appendChild(ul);
        frag.appendChild(sec);
      });

      if (!frag.childNodes.length) {
        body.innerHTML = '<p class="lib-empty">暫無文章</p>';
      } else {
        body.appendChild(frag);
      }
      _libraryRendered = true;
    }

    function toggleLibGroup(btn) {
      const listId = btn.getAttribute('aria-controls');
      const list = document.getElementById(listId);
      if (!list) return;
      const isExpanded = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', isExpanded ? 'false' : 'true');
      list.classList.toggle('collapsed', isExpanded);
    }

    function filterLibrary(query) {
      const q = query.toLowerCase().trim();
      const groups = $('libBody').querySelectorAll('.lib-group');
      let anyVisible = false;

      groups.forEach(group => {
        const items = group.querySelectorAll('.lib-item');
        let groupVisible = false;
        items.forEach(li => {
          const matches = !q || li.dataset.title.includes(q);
          li.style.display = matches ? '' : 'none';
          const titleEl = li.querySelector('.lib-item-title');
          if (titleEl) {
            const raw = li.dataset.rawTitle || titleEl.textContent;
            titleEl.innerHTML = matches && q ? highlight(raw, query) : raw;
          }
          if (matches) groupVisible = true;
        });
        group.style.display = groupVisible ? '' : 'none';
        if (groupVisible) {
          anyVisible = true;
          if (q) {
            const toggle = group.querySelector('.lib-group-toggle');
            const list = group.querySelector('.lib-list');
            if (toggle && list) {
              toggle.setAttribute('aria-expanded', 'true');
              list.classList.remove('collapsed');
            }
          }
        }
      });

      let emptyEl = $('libBody').querySelector('.lib-empty');
      if (!anyVisible) {
        if (!emptyEl) {
          emptyEl = document.createElement('p');
          emptyEl.className = 'lib-empty';
          $('libBody').appendChild(emptyEl);
        }
        emptyEl.textContent = `找不到「${query}」相關文章`;
        emptyEl.style.display = '';
      } else if (emptyEl) {
        emptyEl.style.display = 'none';
      }
    }

    function openLibrary() {
      if (!_libraryRendered) renderLibrary();
      $('library').classList.add('open');
      setBodyLock();
      $('hamburger').setAttribute('aria-expanded', 'true');
      requestAnimationFrame(() => $('libSearch').focus());
    }

    function closeLibrary() {
      $('library').classList.remove('open');
      $('hamburger').setAttribute('aria-expanded', 'false');
      setBodyLock();
      $('hamburger').focus();
    }

    /* ── Hero: News ──────────────────────────────────────────── */
    function renderHeroNews(item) {
      if (!item) return;
      const [y, m, d] = item.date.split('-');
      $('bgM').textContent = m;
      $('bgD').textContent = d;
      $('bgY').textContent = y;

      $('heroNewsInner').innerHTML = `
        <div class="h-tag">最新情報</div>
        <div class="h-date">${fmtDate(item.date)}</div>
        <h2 class="h-title">${item.title}</h2>
        <span class="h-cta" aria-hidden="true">閱讀全文 &rarr;</span>
      `;

      const el = $('heroNews');
      const go = () => openReader(item.path, item.title);
      el.addEventListener('click', go);
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    }

    /* ── Hero: Summary ───────────────────────────────────────── */
    function renderHeroSummary(item) {
      const el = $('heroSummary');
      if (!item) {
        el.innerHTML = '<div class="sum-fallback"></div>';
        return;
      }

      const { main, sub } = splitTitle(item.title);
      const firstChar = main.charAt(0);

      const media = item.hero
        ? `<img class="sum-img" src="${item.hero}" alt="" role="presentation" loading="eager">`
        : `<div class="sum-fallback" data-char="${firstChar}"></div>`;

      el.innerHTML = `
        ${media}
        <div class="sum-overlay" aria-hidden="true"></div>
        <div class="hero-sum-content">
          <div class="h-tag">深度摘要</div>
          <div class="h-date">${fmtDate(item.date)}</div>
          <h2 class="h-title">${main}${sub ? `<span class="h-sub">${sub}</span>` : ''}</h2>
          <span class="h-cta" aria-hidden="true">閱讀全文 &rarr;</span>
        </div>
      `;

      const go = () => openReader(item.path, main);
      el.addEventListener('click', go);
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    }

    /* ── Intersection Observer — staggered card entrance ─────── */
    let staggerDelay = 0;
    const io = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        entry.target.style.animationDelay = `${staggerDelay}ms`;
        entry.target.classList.add('visible');
        staggerDelay = Math.min(staggerDelay + 48, 280); // cap at 280ms
        io.unobserve(entry.target);
      });
    }, { threshold: 0.06 });

    /* ── Theme metadata (extensible for future themes) ──────── */
    const ARCHIVE_LIMIT = 8;

    const THEME_META = {
      news:    { label: 'AI 情報',   cardCls: 'card--news',    tagCls: '' },
      summary: { label: '深度摘要',  cardCls: 'card--summary', tagCls: '' },
    };
    const THEME_FALLBACK = [
      { label: '', cardCls: 'card--news', tagCls: 'card-tag--alt1' },
      { label: '', cardCls: 'card--news', tagCls: 'card-tag--alt2' },
    ];

    function getThemeMeta(key, idx) {
      if (THEME_META[key]) return THEME_META[key];
      const fb = THEME_FALLBACK[idx % THEME_FALLBACK.length];
      return { label: key, cardCls: fb.cardCls, tagCls: fb.tagCls };
    }

    /* ── Archive ─────────────────────────────────────────────── */
    function renderArchive(mf) {
      const grid = $('archiveGrid');
      const entries = Object.entries(mf);

      // Build flat list, skip each theme's [0] (shown in hero), sort newest-first
      const items = entries.flatMap(([key, arr], idx) =>
        arr.slice(1).map(item => ({ ...item, _key: key, _idx: idx }))
      ).sort((a, b) => b.date.localeCompare(a.date)).slice(0, ARCHIVE_LIMIT);

      if (!items.length) {
        grid.innerHTML = '<p style="grid-column:1/-1;padding:3rem;font-family:var(--fm);font-size:.72rem;opacity:.28;letter-spacing:.1em;">暫無往期文章</p>';
        return;
      }

      const frag = document.createDocumentFragment();
      items.forEach(item => {
        const { main, sub } = splitTitle(item.title);
        const meta = getThemeMeta(item._key, item._idx);
        const card = document.createElement('article');
        card.className = `card ${meta.cardCls}`;
        card.setAttribute('role', 'button');
        card.setAttribute('tabindex', '0');
        card.setAttribute('aria-label', `開啟：${main}`);

        const thumb = meta.cardCls === 'card--summary' && item.hero
          ? `<img class="card-thumb" src="${item.hero}" alt="" role="presentation" loading="lazy">`
          : '';
        const tagCls = meta.tagCls ? ` ${meta.tagCls}` : '';

        card.innerHTML = `
          ${thumb}
          <div class="card-tag${tagCls}">${meta.label}</div>
          <div class="card-date">${fmtDate(item.date)}</div>
          <h3 class="card-title">${main}${sub ? `<span class="card-sub">${sub}</span>` : ''}</h3>
          <span class="card-arrow" aria-hidden="true">&rarr;</span>
        `;

        const go = () => openReader(item.path, main);
        card.addEventListener('click', go);
        card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });

        frag.appendChild(card);
        io.observe(card);
      });

      grid.appendChild(frag);
    }

    /* ── Masthead date ───────────────────────────────────────── */
    function setDate() {
      const n = new Date();
      $('mastheadDate').textContent =
        `${n.getFullYear()}·${String(n.getMonth()+1).padStart(2,'0')}·${String(n.getDate()).padStart(2,'0')}`;
    }

    /* ── Module-level manifest (shared with Library) ────────── */
    let manifest = null;

    /* ── Init ────────────────────────────────────────────────── */
    async function init() {
      setDate();

      try {
        const res = await fetch('manifest.json');
        if (!res.ok) throw new Error(res.status);
        manifest = await res.json();
      } catch {
        $('heroNewsInner').innerHTML = `
          <p style="font-family:var(--fm);font-size:.72rem;color:rgba(200,168,75,.5);line-height:1.9;letter-spacing:.04em">
            無法載入 manifest.json<br>
            請用本機伺服器開啟，或執行：<br>
            <code style="opacity:.65">python scripts/build_manifest.py</code>
          </p>`;
        return;
      }

      const news = manifest.news ?? [];
      const summary = manifest.summary ?? [];
      renderHeroNews(news[0]);
      renderHeroSummary(summary[0]);
      renderArchive(manifest);

      // Library trigger bindings
      $('hamburger').addEventListener('click', openLibrary);
      $('libClose').addEventListener('click', closeLibrary);
      $('archiveMoreBtn').addEventListener('click', openLibrary);
      $('libSearch').addEventListener('input', e => {
        clearTimeout(_searchTimer);
        _searchTimer = setTimeout(() => filterLibrary(e.target.value), 120);
      });
    }

    init();
  </script>
</body>
</html>
